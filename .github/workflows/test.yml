name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # dsh-tools is an optional peer dependency (host provides it at
      # runtime); install it explicitly for typecheck/tests in CI
      - run: npm install --no-save @deepseek-ai/dsh-tools@^0.1.1-rc.2
      - run: npm run typecheck
      - run: npm test
